<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Excellence</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />

    <!-- Mobile -->
    <link
      rel="preload"
      as="image"
      href="./images/hero-bg.jpg"
      imagesrcset="./images/hero-bg.jpg 1x, ./images/hero-bg@2x.jpg 2x"
      media="(max-width: 767.98px)"
      fetchpriority="high"
    />

    <!-- Tablet -->
    <link
      rel="preload"
      as="image"
      href="./images/hero-bg-tablet.jpg"
      imagesrcset="./images/hero-bg-tablet.jpg 1x, ./images/hero-bg-tablet@2x.jpg 2x"
      media="(min-width: 768px) and (max-width: 1279.98px)"
    />

    <!-- Desktop -->
    <link
      rel="preload"
      as="image"
      href="./images/hero-bg-desktop.jpg"
      imagesrcset="./images/hero-bg-desktop.jpg 1x, ./images/hero-bg-desktop@2x.jpg 2x"
      media="(min-width: 1280px)"
    />
  </head>

  <body>
    <load src="./partials/header.html" />

    <main>
      <!-- Loads the specified .html file -->
      <load src="./partials/hero.html" />
      <load src="./partials/about-us.html" />
      <load src="./partials/our-lessons.html" />
      <load src="./partials/proposal.html" />
      <load src="./partials/our-teachers.html" />
      <load src="./partials/leave-an-app.html" />
      <load src="./partials/reviews.html" />
    </main>

    <load src="./partials/footer.html" />
    <script type="module" src="./main.js"></script>
  </body>
</html>
